<head>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Yrsa:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet">

  <!--  for titles-->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&family=Yrsa:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet">
</head>

<main class="main-container">
  <h2 class="main-title">Catalog</h2>
  <div class="filter-container mb-8">
    <h2 class="filter-title">Filter</h2>
    <form class="filter-form">
      <div class="filter-item">
        <label for="brand">Brand</label>
        <input type="text" id="brand" name="brand" placeholder="Enter car mark"
               [(ngModel)]="filter.brand">
      </div>
      <div class="filter-item">
        <label>Condition</label>
        <div class="condition-select">
          <select class="form-select" [(ngModel)]="filter.condition" name="condition">
            <option value="" selected>Any condition</option>
            <option value="new">New</option>
            <option value="used">Used</option>
          </select>
        </div>
      </div>
      <div class="filter-item">
        <label for="year">Year of release</label>
        <input type="number" id="year" name="year" placeholder="Enter year of release"
               [(ngModel)]="filter.year">
      </div>
      <div class="filter-item">
        <label for="price">Price</label>
        <div class="price-range">
          <input type="number" id="price-from" name="price-from" placeholder="From"
                 [(ngModel)]="filter.priceFrom">
          <input type="number" id="price-to" name="price-to" placeholder="To"
                 [(ngModel)]="filter.priceTo">
        </div>
      </div>
      <div class="filter-actions">
        <!-- Если вы хотите кнопку Apply (необязательно при автоматической фильтрации) -->
        <!-- <button type="button" class="apply-button">Apply Filters</button> -->
        <button type="button" class="reset-button" (click)="resetFilters()">Reset</button>
      </div>
    </form>
  </div>
  <div class="car-cards-container">
    <!-- Карточки автомобилей с фильтрацией -->
    <div class="car-card" *ngFor="let car of filteredCars; let i = index" [class]="'delay-' + ((i % 3) + 1)">
      <img [src]="car.image" alt="Car Image" class="car-img">
      <div class="car-info">
        <h3 class="car-title">{{car.brand}} {{car.model}}</h3>
        <p class="text-gray-600 mt-2">Year: {{car.year}}</p>
        <p class="text-gray-600">Engine: {{car.engine}}</p>
        <p class="text-gray-600">Price: {{car.price | number}} ₸</p>
        <p class="text-gray-600">Condition: {{car.condition === 'new' ? 'New' : 'Used'}}</p>
        <button class="car-button">More detailed</button>
      </div>
    </div>

    <!-- Сообщение, если ничего не найдено -->
    <div *ngIf="filteredCars.length === 0" class="no-results">
      No cars match your filter criteria.
    </div>
  </div>
</main>
