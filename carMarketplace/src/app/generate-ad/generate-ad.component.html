<div class="place-ad-container">
  <h2>Generate an ad</h2>
  <form (ngSubmit)="submitAd()" #adForm="ngForm">
    <label>
      Car brand:
      <input type="text" name="brand" [(ngModel)]="brand" required />
    </label>

    <label>
      Condition:
      <select name="condition" [(ngModel)]="condition" required>
        <option value="" disabled selected>Select condition</option>
        <option value="new">New</option>
        <option value="used">Used</option>
      </select>
    </label>

    <label>
      Year of release:
      <input type="number" name="year" min="1900" max="2025" [(ngModel)]="year" required />
    </label>

    <label>
      Price (₸):
      <input type="number" name="price" min="0" step="1000" [(ngModel)]="price" required />
    </label>

    <label>
      Upload photo:
      <input type="file" (change)="onPhotoSelected($event)" accept="image/*" required />
    </label>

    <button type="submit">Place an ad</button>
  </form>
</div>
