<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Yrsa:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&family=Yrsa:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet">
</head>

<main>
  <div class="login-form">
    <h2>Login</h2>
    
    <form (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>Username</label>
        <input type="text" 
               [(ngModel)]="username"
               name="username"
               placeholder="Enter your username"
               required>
      </div>
  
      <div class="form-group">
        <label>Password</label>
        <input type="password" 
               [(ngModel)]="password"
               name="password"
               placeholder="Enter your password"
               required>
      </div>
  
      <div *ngIf="errorMessage" class="error-message">
        {{ errorMessage }}
      </div>
  
      <button type="submit" [disabled]="isLoading" class="login-button">
        {{ isLoading ? 'Loading...' : 'Login' }}
      </button>
  
      <div class="register-link">
        Don't have an account? <a routerLink="/register">Register</a>
      </div>
  
      <button type="button" (click)="fillTestCredentials()" class="test-btn">
        Fill test credentials
      </button>
    </form>
  </div>
</main>
